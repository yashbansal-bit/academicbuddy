services:
  - type: web
    name: academicbuddy
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: academicbuddy-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/academicbuddy.sqlite
      - key: BASE_URL
        sync: false
      - key: AI_PROVIDER
        value: openai-compatible
